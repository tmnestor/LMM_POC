# =========================================================================
# QUALITY SCREEN PROMPTS
# =========================================================================
# Each prompt variant carries its own `evidence:` block: the answer that
# indicates a LOW QUALITY image, for exactly the criteria that variant asks
# about. Evidence lives with the prompt so a variant can never be scored
# against another variant's field set.
#
# POLARITY IS NOT UNIFORM. Most criteria are phrased as "is there a defect?"
# (low quality = true), but some are phrased as "is it good?" (low quality =
# false). Each block below encodes the phrasing of that variant's own
# questions. Note in particular that `skewing` is false in v1/v2 and true in
# v4 - the same key name, the opposite expected value, because v4 rewords the
# question from "is it aligned?" to "must you mentally rotate it?".
#
# Rationale per criterion (why it signals low quality):
#   sharpness   - low quality images will have blurry text
#   handwriting - presence of handwriting may lower OCR fidelity or visual
#                 understanding depending on its legibility
#   collage     - LMM performance lowered if image is of multiple pages on top
#                 of each other or side-by-side
#   shadows     - shadows may obscure text and decrease legibility
#   artefacts   - artefacts created via bad scanning and copying may distort
#                 text and decrease legibility
#   fading      - text on printed documents may fade over time, particularly
#                 if printed on thermal paper, decreasing its legibility
#   creasing    - creases on paper documents may distort text and decrease
#                 legibility
#   staining    - stains on paper documents may distort text and decrease
#                 legibility
#   rotation    - pages that are oriented off the vertical may affect
#                 alignment and visual understanding of text, particularly in
#                 borderless tables
#   skewing     - lines of text printed or written off the horizontal or
#                 vertical may affect OCR fidelity and visual understanding
#   warping     - page may appear curled or distorted due to how the scan or
#                 photo was taken
#   orientation - text that does not share a single reading order breaks the
#                 left-to-right reading order (v3 only; replaces rotation,
#                 skewing and warping)
# =========================================================================

prompts:
  quality_screen:
    name: "quality_screen_v1"
    # 11 criteria. sharpness/skewing/warping are phrased "is it good?", so
    # false is the low-quality answer for those three.
    evidence:
      sharpness: false
      handwriting: true
      collage: true
      shadows: true
      artefacts: true
      fading: true
      creasing: true
      staining: true
      rotation: true
      skewing: false
      warping: false
    prompt: |
      Look at this document image and answer each question exactly with YES or NO.
      No explanations or extra text. If uncertain, answer exactly: NONE.

      1. SHARPNESS: Is the text in focus and clearly defined?
      2. HANDWRITING: Is there handwritten text on the image?
      3. COLLAGE: Is there more than one page on the image? Disregard page numbers,
         headers, footers and other pagination markers as evidence. Instead consider
         evidence where physical pages were placed together in a scanner or photo.
      4. SHADOWS: Are there shadows cast anywhere on the image?
      5. ARTEFACTS: Does the image have compression artefacts, graininess, or digital
         noise that interferes with text legibility?
      6. FADING: Is there any printed text faded to the point where characters are
         difficult to distinguish?
      7. CREASING: Does the image have folds or creases that obscure or distort text?
      8. STAINING: Does the image have stains, tears, water damage, or ink smearing
         that cover text areas?
      9. ROTATION: Is the image orientation significantly rotated from vertical?
      10. SKEWING: Is all text on the image aligned perfectly horizontally without
          noticeable tilt?
      11. WARPING: Is the image flat and free from curling or warping that distorts text?

      Now analyse the provided document image and respond by filling in this template:
      1. SHARPNESS:
      2. HANDWRITING:
      3. COLLAGE:
      4. SHADOWS:
      5. ARTEFACTS:
      6. FADING:
      7. CREASING:
      8. STAINING:
      9. ROTATION:
      10. SKEWING:
      11. WARPING:

  # ---------------------------------------------------------------------
  # DISABLED: collage_check / collage_detection
  # ---------------------------------------------------------------------
  # Commented out rather than deleted. This is a dedicated multi-document
  # detector (11 sub-questions, `collage_detection` name), not an image
  # quality screen: it duplicates the single COLLAGE criterion that every
  # quality_screen variant already asks, and running both would cost a
  # second inference pass per image and produce two collage verdicts to
  # reconcile. Re-enable by stripping the leading "# " from the block below.
  # ---------------------------------------------------------------------
#   collage_check:
#     name: "collage_detection"
#     # Every question asks "is there a sign of more than one document?", so
#     # true is the low-quality (collage present) answer throughout. OVERALL is
#     # the model's own summary judgement over the preceding ten.
#     evidence:
#       side: true
#       overlap: true
#       columns: true
#       edges: true
#       background: true
#       dimensions: true
#       areas: true
#       font: true
#       structure: true
#       info: true
#       overall: true
#     prompt: |
#       Look at this document image. This image may contain MULTIPLE separate document pages,
#       possibly from the same business. It is IMPORTANT that you disregard page numbers
#       and other pagination markers as evidence of multiple documents.
#       Answer each question exactly with YES or NO. If uncertain, answer exactly: NONE.
#
#       1. SIDE: Is the image of multiple physical paper documents (e.g. receipts, parking tickets)
#          placed next to each other?
#       2. OVERLAP: Does the image contain one or more papers on top of (or stapled to) a
#          larger sheet of paper?
#       3. COLUMNS: Is there more than one column of text? Do not count columns of a table.
#       4. EDGES: Are there visible edges, shadows, or gaps suggesting more than one piece of paper?
#          Do not count the boundary where a single document meets the table, surface, or hand behind it.
#       5. BACKGROUND: Are there areas with noticeably different paper colour, whiteness, or texture
#          (e.g., thermal receipt paper vs bright white copy paper, or different levels of yellowing/ageing)?
#       6. DIMENSIONS: Are there visible boundaries suggesting documents of different widths or
#          heights within the image (e.g., a narrow receipt beside a wider invoice)?
#       7. AREAS: Are there distinct zones with noticeably different sharpness, blur, or scan quality?
#       8. FONT: Are there large square or rectangular zones where the printed text is in a different
#          font, colour and/or orientation when compared to the surrounding text?
#       9. STRUCTURE: Are there repetitive structural elements in the image? For example, repeated
#          headers, footers, business logos or wordmarks? Do not count content from tables
#          when considering your answer.
#       10. INFO: Does the image contain repetitive information laid out in the same format? For example,
#           repeated names, dates, locations, overall totals? Disregard text in tables, line item
#           descriptions and amounts when considering your answer.
#       11. OVERALL: After considering all the above questions, does this image depict more than
#           one distinct physical document?
#
#       Now analyse the provided document image and respond by filling in this template:
#       1. SIDE:
#       2. OVERLAP:
#       3. COLUMNS:
#       4. EDGES:
#       5. BACKGROUND:
#       6. DIMENSIONS:
#       7. AREAS:
#       8. FONT:
#       9. STRUCTURE:
#       10. INFO:
#       11. OVERALL:

  quality_screen_v2:
    name: "quality_screen_v2"
    # Same 11 criteria and same polarity as v1; the wording of several
    # questions is tightened but none of them flips direction.
    evidence:
      sharpness: false
      handwriting: true
      collage: true
      shadows: true
      artefacts: true
      fading: true
      creasing: true
      staining: true
      rotation: true
      skewing: false
      warping: false
    prompt: |
      Look at this document image and answer each question exactly with YES or NO.
      No explanations or extra text. If uncertain, answer exactly: NONE.

      1. SHARPNESS: Is the text in focus and clearly defined?
      2. HANDWRITING: Is there handwritten text on the image?
      3. COLLAGE: Is there more than one page on the image? Disregard page numbers,
         headers, footers and other pagination markers as evidence. Instead consider
         evidence of physical pages being placed together in a scanner or photo such as
         page edges and localised areas of text with a different font or orientation.
      4. SHADOWS: Are there shadows that are being cast on the image?
      5. ARTEFACTS: Are there compression artefacts, graininess, or digital
         noise in the image?
      6. FADING: Is there any text that is faded or badly printed to the point where
         characters are difficult to distinguish?
      7. CREASING: Are there any folds or creases that obscure or distort text?
      8. STAINING: Are there any stains, tears, water damage, or ink smearing?
      9. ROTATION: Are the edges or margins significantly rotated from the
         vertical?
      10. SKEWING: Are ALL lines of text aligned perfectly horizontally without
          noticeable tilt? Consider whether the beginning of a line of text is in the
          same horizontal or vertical level as the end of a line of text.
      11. WARPING: Is the document in the image flat and free from curling or
          warping that distorts text?

      Now analyse the provided document image and respond by filling in this template:
      1. SHARPNESS:
      2. HANDWRITING:
      3. COLLAGE:
      4. SHADOWS:
      5. ARTEFACTS:
      6. FADING:
      7. CREASING:
      8. STAINING:
      9. ROTATION:
      10. SKEWING:
      11. WARPING:

  quality_screen_v3:
    name: "quality_screen_v3"
    # 9 criteria. ROTATION, SKEWING and WARPING are collapsed into a single
    # ORIENTATION question, phrased "is it good?", so false is low quality.
    evidence:
      sharpness: false
      handwriting: true
      collage: true
      shadows: true
      artefacts: true
      fading: true
      creasing: true
      staining: true
      orientation: false
    prompt: |
      Look at this document image and answer each question exactly with YES or NO.
      No explanations or extra text. If uncertain, answer exactly: NONE.

      1. SHARPNESS: Is the text in focus and clearly defined?
      2. HANDWRITING: Is there handwritten text on the image?
      3. COLLAGE: Is there more than one page on the image? Disregard page numbers,
         headers, footers and other pagination markers as evidence. Instead consider
         evidence such as physical pages being placed together in a scanner or photo.
      4. SHADOWS: Are there shadows cast anywhere on the image?
      5. ARTEFACTS: Does the image have compression artefacts, graininess, or digital
         noise that interferes with text legibility?
      6. FADING: Is there any printed text faded to the point where characters are
         difficult to distinguish?
      7. CREASING: Are there any folds or creases that obscure or distort text?
      8. STAINING: Are there any stains, tears, water damage, or ink smearing?
      9. ORIENTATION: Is all text in the image in the same orientation? Base your
         answer on a reading order of left to right and direction of text lines.

      Now analyse the provided document image and respond by filling in this template:
      1. SHARPNESS:
      2. HANDWRITING:
      3. COLLAGE:
      4. SHADOWS:
      5. ARTEFACTS:
      6. FADING:
      7. CREASING:
      8. STAINING:
      9. ORIENTATION:

  quality_screen_v4:
    name: "quality_screen_v4"
    # 9 criteria. SKEWING is INVERTED relative to v1/v2: the question becomes
    # "do you have to mentally rotate the image to read it?", so true is the
    # low-quality answer here. Do not copy v1/v2's skewing value onto v4.
    evidence:
      sharpness: false
      handwriting: true
      collage: true
      shadows: true
      artefacts: true
      fading: true
      creasing: true
      staining: true
      skewing: true
    prompt: |
      Look at this document image and answer each question exactly with YES or NO.
      No explanations or extra text. If uncertain, answer exactly: NONE.

      1. SHARPNESS: Is the text in focus and clearly defined?
      2. HANDWRITING: Is there handwritten text on the image?
      3. COLLAGE: Is there more than one document on the image? Disregard page numbers,
         headers, footers and other pagination markers as evidence. Instead consider as
         evidence physical paper documents (e.g. receipts, parking tickets) being placed next
         to each other, visible edges, shadows, or gaps suggesting separate pieces of paper,
         and large areas of the image where the printed text is in a different font or
         orientation.
      4. SHADOWS: Are there shadows cast anywhere on the image?
      5. ARTEFACTS: Does the image have compression artefacts, graininess, or digital
         noise that interferes with text legibility?
      6. FADING: Is there any printed text faded to the point where characters are
         difficult to distinguish?
      7. CREASING: Are there any folds or creases that obscure or distort text?
      8. STAINING: Are there any stains, tears, water damage, or ink smearing?
      9. SKEWING: Read all lines of text in this document. Then tell me if you, at any
         point, have to mentally rotate the image to read it?

      Now analyse the provided document image and respond by filling in this template:
      1. SHARPNESS:
      2. HANDWRITING:
      3. COLLAGE:
      4. SHADOWS:
      5. ARTEFACTS:
      6. FADING:
      7. CREASING:
      8. STAINING:
      9. SKEWING:

  # =======================================================================
  # v6 -- v5 with the threshold lowered. Same six criteria, same names.
  # =======================================================================
  # v5 and the describe variant were run on the same images at the same
  # tiling. The model DESCRIBED a moderate receipt as "slightly blurry towards
  # the bottom, faded or patchy areas, slightly grainy and speckled" -- and
  # then answered NO to blur, faded and speckle when asked YES or NO.
  #
  # So it perceives the damage and reports it as a matter of DEGREE. Its own
  # words are "slightly", "mostly sharp", "a bit grainy". A binary question
  # forces that onto a threshold, and the model's threshold for YES sits well
  # above the corpus's: a drawn blur sigma of 0.65 is a defect in the ground
  # truth and "mostly sharp" to the model.
  #
  # v6 changes nothing but where the bar sits. Every question asks whether the
  # defect is present AT ALL, and the instruction says so explicitly. The
  # criteria names are unchanged, so the scorer and the corpus labels need no
  # translation.
  #
  # If this closes the gap, the screen works. If it overshoots into answering
  # YES to everything, the clean third of the corpus will catch it -- which is
  # what that third is for, and why the report gives precision per criterion
  # rather than one blended number.
  quality_screen_v6:
    name: "quality_screen_v6"
    evidence:
      blur: true
      shadow: true
      crease: true
      faded: true
      tilt: true
      speckle: true
    overall_levels: [NONE, MODERATE, HEAVY]
    prompt: |
      Look at this picture of a receipt or invoice and answer each question with YES or NO.

      Answer YES if you notice the problem at all, even slightly, or in only part of the
      picture. Answer NO only if the problem is completely absent.

      1. BLUR: Is any of the writing blurry, soft or out of focus, even slightly?
      2. SHADOW: Is any part of the paper darker because of a shadow falling on it?
      3. CREASE: Does the paper look folded, creased, crumpled or torn anywhere?
      4. FADED: Is any of the printing faded, patchy, uneven or broken up?
      5. TILT: Is the paper crooked or rotated at all, instead of square to the picture?
      6. SPECKLE: Does the picture look grainy, speckled or noisy anywhere?
      7. OVERALL: How bad is the picture overall? Answer NONE, MODERATE or HEAVY.
         Answer NONE only if you found no problems at all above.

      Fill in this template:
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
      7. OVERALL:

  # =======================================================================
  # v7 -- describe first, then answer. One pass.
  # =======================================================================
  # The evidence this is built on, all at min_tiles 12 on the same images:
  #
  #   describe   receipt moderate 5/6, receipt heavy 5/6
  #   v5         receipt moderate 2/6, receipt heavy 3/6
  #   v6         receipt moderate 2/6, receipt heavy 4/6
  #
  # v6 lowered the YES threshold and barely moved the moderate case, so the
  # problem is not only where the bar sits. Asked to describe, the model
  # examines the picture and reports what it sees. Asked YES or NO, it appears
  # to answer from a prior rather than from the image.
  #
  # So make it describe first and answer second, in a single generation. The
  # description is not decoration: it is the model doing the looking that the
  # bare questions skip. The reader already ignores prose around the numbered
  # template, so this needs no parser change.
  #
  # Note the tension with prompts-need-cot-drift-defense: asking InternVL3.5 to
  # reason is close to the behaviour that triggers <think> drift. This asks for
  # a description rather than reasoning, and never says "think" or "step by
  # step". think_drift is recorded per response, so the rate is measurable
  # rather than assumed -- if it climbs, that is the cost of this variant.
  quality_screen_v7:
    name: "quality_screen_v7"
    evidence:
      blur: true
      shadow: true
      crease: true
      faded: true
      tilt: true
      speckle: true
    overall_levels: [NONE, MODERATE, HEAVY]
    prompt: |
      Look at this picture of a receipt or invoice.

      First write one or two sentences describing the physical condition of the paper
      and the printing. Say what you actually see.

      Then answer each question with YES or NO, based on what you just described.
      Answer YES if you notice the problem at all, even slightly, or in only part of
      the picture.

      1. BLUR: Is any of the writing blurry, soft or out of focus, even slightly?
      2. SHADOW: Is any part of the paper darker because of a shadow falling on it?
      3. CREASE: Does the paper look folded, creased, crumpled or torn anywhere?
      4. FADED: Is any of the printing faded, patchy, uneven or broken up?
      5. TILT: Is the paper crooked or rotated at all, instead of square to the picture?
      6. SPECKLE: Does the picture look grainy, speckled or noisy anywhere?
      7. OVERALL: How bad is the picture overall? Answer NONE, MODERATE or HEAVY.
         Answer NONE only if you found no problems at all above.

      Use this format:
      DESCRIPTION: <your one or two sentences>
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
      7. OVERALL:

  # =======================================================================
  # v8 -- enumerate the six aspects in the description, then answer.
  # =======================================================================
  # v7 asked for a description and got a summary: "the printing is sharp" for a
  # moderate receipt whose print is measurably patchy. The standalone describe
  # variant, on the same image at the same tiling, said "slightly blurry
  # towards the bottom, faded or patchy areas especially in the lower section,
  # slightly grainy and speckled".
  #
  # The only difference was that describe ENUMERATED the six aspects and v7 did
  # not. Given a generic instruction the model summarises and skips detail;
  # given an enumerated one it checks each thing in turn. Its YES/NO answers
  # then follow whichever description it wrote -- so the description is where
  # the accuracy is won or lost.
  #
  # v8 puts the enumeration back, then asks for the template.
  quality_screen_v8:
    name: "quality_screen_v8"
    evidence:
      blur: true
      shadow: true
      crease: true
      faded: true
      tilt: true
      speckle: true
    overall_levels: [NONE, MODERATE, HEAVY]
    prompt: |
      Look at this picture of a receipt or invoice.

      First describe what you see, covering each of these in turn:
      - whether the writing looks sharp or blurry anywhere
      - whether any part of the paper is darker because of a shadow
      - whether the paper looks folded, creased, crumpled or torn
      - whether any printing looks faded, patchy or broken up
      - whether the paper is square to the picture or crooked
      - whether the picture looks grainy or speckled

      Then answer each question with YES or NO, matching what you described.
      Answer YES if you noticed the problem at all, even slightly, or in only
      part of the picture.

      1. BLUR: Is any of the writing blurry, soft or out of focus, even slightly?
      2. SHADOW: Is any part of the paper darker because of a shadow falling on it?
      3. CREASE: Does the paper look folded, creased, crumpled or torn anywhere?
      4. FADED: Is any of the printing faded, patchy, uneven or broken up?
      5. TILT: Is the paper crooked or rotated at all, instead of square to the picture?
      6. SPECKLE: Does the picture look grainy, speckled or noisy anywhere?
      7. OVERALL: How bad is the picture overall? Answer NONE, MODERATE or HEAVY.
         Answer NONE only if you found no problems at all above.

      Use this format:
      DESCRIPTION: <your description>
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
      7. OVERALL:

  # =======================================================================
  # v9 -- inverted polarity, exploiting the model's reluctance to say YES.
  # =======================================================================
  # Measured on 60 images with v6 at min_tiles 12:
  #
  #   precision 1.000 on EVERY criterion. Zero false positives.
  #   recall 0.05 - 0.65.
  #   OVERALL never over-called: NONE->NONE 20/20, and every error an
  #   under-call (HEAVY->MODERATE 17, MODERATE->NONE 10).
  #
  # The model is not confused, it is conservative. It says YES only when a
  # defect is unmistakable, and is right every single time it does. Fighting
  # that with "even slightly" (v6) and with a description step (v7, v8) barely
  # moved recall.
  #
  # So stop fighting it. Ask the question the other way round, and the same
  # reluctance now works for us: a model unwilling to assert "YES it is
  # blurred" is equally unwilling to assert "YES it is perfectly sharp" when
  # anything is off. NO becomes the detection.
  #
  # This is what v1-v4 did with SHARPNESS, SKEWING and WARPING, which I
  # removed in v5 for uniformity. The uniformity was worth less than the
  # polarity.
  #
  # Not every criterion inverts well. A good-phrased question needs a natural
  # absolute -- "perfectly sharp", "completely flat", "even and unbroken" --
  # and CREASE and SHADOW have none that is not tortured ("is the paper
  # entirely free of shadow?" invites the same conservatism in the same
  # direction). Those two stay defect-phrased, so this variant is deliberately
  # MIXED. The evidence block below is the record of which is which, and the
  # scorer now reads it.
  quality_screen_v9:
    name: "quality_screen_v9"
    # false = a good-phrased question, where NO means the defect is present.
    evidence:
      blur: false
      shadow: true
      crease: true
      faded: false
      tilt: false
      speckle: false
    overall_levels: [NONE, MODERATE, HEAVY]
    prompt: |
      Look at this picture of a receipt or invoice and answer each question with YES or NO.

      Answer YES only if the statement is completely true of the whole picture.
      If any part of it falls short, answer NO.

      1. BLUR: Is every word perfectly sharp and in focus, across the whole picture?
      2. SHADOW: Is any part of the paper darker because of a shadow falling on it?
      3. CREASE: Does the paper look folded, creased, crumpled or torn anywhere?
      4. FADED: Is the printing even and unbroken everywhere, with no faded or patchy parts?
      5. TILT: Is the paper perfectly square to the edges of the picture, not turned at all?
      6. SPECKLE: Is the picture perfectly clean and smooth, with no grain or speckling?
      7. OVERALL: How bad is the picture overall? Answer NONE, MODERATE or HEAVY.
         Answer NONE only if the picture is perfect in every way.

      Fill in this template:
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
      7. OVERALL:

  # =======================================================================
  # v10 -- v6's questions with v9's stricter OVERALL. Both halves measured.
  # =======================================================================
  # WHAT THE SIX QUESTIONS ARE FOR. They are not six independent measurements.
  # v1-v4 asked them to walk the model through the evidence before it commits
  # to a verdict -- chain-of-thought by enumeration. OVERALL is the product;
  # the criteria are the reasoning that is meant to improve it.
  #
  # That reframes every number measured so far. Per-criterion recall of 0.3 is
  # not a failure if the questions are doing their job, and per-criterion
  # precision of 1.000 is not a success if OVERALL stays wrong.
  #
  # Measured on 60 images at min_tiles 12:
  #
  #   v6  per-criterion precision 1.000, recall 0.05-0.65
  #       OVERALL 33/60 = 55%
  #   v9  inverted polarity: per-criterion collapsed to zero true positives
  #       OVERALL 41/60 = 68%
  #
  # v9's per-criterion inversion failed outright -- the model has a semantic
  # prior that documents are fine and states it correctly in either phrasing,
  # so inverting only changed which token carried the same wrong belief. But
  # its OVERALL was markedly better, and the only wording change there was
  # "Answer NONE only if the picture is perfect in every way".
  #
  # v10 takes the half of each that measured well: v6's defect-phrased
  # questions, which hold precision at 1.000, and v9's stricter OVERALL. It
  # invents nothing.
  quality_screen_v10:
    name: "quality_screen_v10"
    evidence:
      blur: true
      shadow: true
      crease: true
      faded: true
      tilt: true
      speckle: true
    overall_levels: [NONE, MODERATE, HEAVY]
    prompt: |
      Look at this picture of a receipt or invoice and answer each question with YES or NO.

      Answer YES if you notice the problem at all, even slightly, or in only part of the
      picture. Answer NO only if the problem is completely absent.

      1. BLUR: Is any of the writing blurry, soft or out of focus, even slightly?
      2. SHADOW: Is any part of the paper darker because of a shadow falling on it?
      3. CREASE: Does the paper look folded, creased, crumpled or torn anywhere?
      4. FADED: Is any of the printing faded, patchy, uneven or broken up?
      5. TILT: Is the paper crooked or rotated at all, instead of square to the picture?
      6. SPECKLE: Does the picture look grainy, speckled or noisy anywhere?
      7. OVERALL: Now judge the picture as a whole. Answer NONE, MODERATE or HEAVY.
         Answer NONE only if the picture is perfect in every way.
         Answer MODERATE if it has problems but every word can still be read.
         Answer HEAVY if any part is hard to read.

      Fill in this template:
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
      7. OVERALL:

  # =======================================================================
  # v11 -- v9 with the answer-space leak closed. The current best candidate.
  # =======================================================================
  # v9, scored correctly, is the strongest variant measured on 60 images:
  #
  #   inverted criteria    recall 1.000, precision 0.31-0.74
  #   FADED F1 0.849, SPECKLE 0.822, BLUR 0.734, TILT 0.478
  #   invoices             FADED 0.971, SPECKLE 0.944, SHADOW 1.000
  #   OVERALL              41/51 = 80%, against 55% for v6 and 48% for the
  #                        no-criteria control
  #
  # Polarity turned out to be a precision/recall dial. Defect-phrased gives
  # precision 1.000 and misses most defects; good-phrased gives recall 1.000
  # and over-flags. A screen exists to catch images needing re-capture, so a
  # false positive costs a second look and a false negative ships a bad image
  # into extraction. Recall is the side worth buying.
  #
  # Its one flaw: 9 of 60 responses were unreadable, every one of them the
  # model answering NONE to SPECKLE. SPECKLE was the last binary question,
  # directly above an OVERALL whose options are NONE / MODERATE / HEAVY, and
  # its own wording ("with no grain or speckling") primes the word. The answer
  # space leaked one slot upward.
  #
  # Two changes, both aimed at that: questions 1-6 are explicitly constrained
  # to YES or NO, and SPECKLE no longer contains the word "no". Nothing else
  # moves, so v11 stays comparable to v9.
  quality_screen_v11:
    name: "quality_screen_v11"
    evidence:
      blur: false
      shadow: true
      crease: true
      faded: false
      tilt: false
      speckle: false
    overall_levels: [NONE, MODERATE, HEAVY]
    prompt: |
      Look at this picture of a receipt or invoice.

      Questions 1 to 6 must be answered with the single word YES or NO. Nothing else.
      Answer YES only if the statement is completely true of the whole picture.
      If any part of it falls short, answer NO.

      1. BLUR: Is every word perfectly sharp and in focus, across the whole picture?
      2. SHADOW: Is any part of the paper darker because of a shadow falling on it?
      3. CREASE: Does the paper look folded, creased, crumpled or torn anywhere?
      4. FADED: Is the printing even and unbroken everywhere, with no faded or patchy parts?
      5. TILT: Is the paper perfectly square to the edges of the picture, not turned at all?
      6. SPECKLE: Is the picture perfectly smooth and free of grain, speckling or noise?

      Question 7 is different. Judge the picture as a whole and answer with one of
      NONE, MODERATE or HEAVY.
      7. OVERALL: Answer NONE only if the picture is perfect in every way.

      Fill in this template:
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
      7. OVERALL:

  # =======================================================================
  # v12 -- v11 with a severity vocabulary that cannot collide with YES/NO.
  # =======================================================================
  # v9 lost 9 of 60 responses and v11 lost 15, and the reasons name the cause
  # exactly:
  #
  #   8x  speckle answered 'NONE'   -- borrowed from OVERALL's options
  #   7x  overall answered 'NO'     -- borrowed from the questions
  #
  # The bleed runs BOTH ways across the slot 6 / slot 7 boundary. One template
  # carrying two answer spaces, and the model does not reliably switch between
  # them. v11's attempt to fix this by announcing "Question 7 is different"
  # left the first failure untouched and introduced the second.
  #
  # So remove the collision instead of signposting it. GOOD / FAIR / POOR
  # shares no token with YES or NO, and -- unlike NONE -- none of them is a
  # natural answer to "is there any grain?". The criteria questions are v11's,
  # unchanged.
  #
  # The variant brings its own condition_to_level, because renaming the levels
  # without remapping the corpus conditions would fail every severity call
  # while the criteria kept scoring fine.
  quality_screen_v12:
    name: "quality_screen_v12"
    evidence:
      blur: false
      shadow: true
      crease: true
      faded: false
      tilt: false
      speckle: false
    overall_levels: [GOOD, FAIR, POOR]
    condition_to_level:
      clean: GOOD
      moderate: FAIR
      heavy: POOR
    prompt: |
      Look at this picture of a receipt or invoice.

      Questions 1 to 6 must be answered with the single word YES or NO.
      Answer YES only if the statement is completely true of the whole picture.
      If any part of it falls short, answer NO.

      1. BLUR: Is every word perfectly sharp and in focus, across the whole picture?
      2. SHADOW: Is any part of the paper darker because of a shadow falling on it?
      3. CREASE: Does the paper look folded, creased, crumpled or torn anywhere?
      4. FADED: Is the printing even and unbroken everywhere, with no faded or patchy parts?
      5. TILT: Is the paper perfectly square to the edges of the picture, not turned at all?
      6. SPECKLE: Is the picture perfectly smooth and free of grain, speckling or noise?
      7. OVERALL: Rate the whole picture as GOOD, FAIR or POOR.
         GOOD means you found nothing wrong with it at all.
         FAIR means you found something wrong but the receipt is still easy to use.
         POOR means several things are wrong with it.

      Fill in this template:
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
      7. OVERALL:

  # =======================================================================
  # CONTROL -- OVERALL only, no criteria. Answers "does the scaffolding help?"
  # =======================================================================
  # If the six questions exist to make the model reason before it judges, the
  # experiment that tests them is asking OVERALL WITHOUT them. Nothing measured
  # so far does that, so nothing measured so far shows the scaffolding earns
  # its cost.
  #
  # Two outcomes, both worth having. If this scores near v10's OVERALL, the
  # criteria are not adding anything and the screen is a one-question prompt at
  # a fraction of the tokens. If it scores materially worse, the
  # chain-of-thought is doing real work and the criteria stay -- with their own
  # accuracy a secondary concern, as intended.
  #
  # The reader needs at least one criterion to check slots against, so this
  # declares OVERALL alone and the evidence block is deliberately empty of
  # defect criteria. Scoring it compares the confusion matrix only.
  quality_screen_overall_only:
    name: "quality_screen_overall_only"
    evidence: {}
    overall_levels: [NONE, MODERATE, HEAVY]
    prompt: |
      Look at this picture of a receipt or invoice and judge its quality as a whole.

      Answer NONE, MODERATE or HEAVY.
        NONE     the picture is perfect in every way
        MODERATE it has problems but every word can still be read
        HEAVY    any part is hard to read

      Fill in this template:
      1. OVERALL:

  # =======================================================================
  # DIAGNOSTIC -- not a screen. Free text, deliberately unparseable.
  # =======================================================================
  # Answers one question: does the model PERCEIVE the degradation at all?
  #
  # The first real run answered NO to 23 of 24 questions, including on heavy
  # images carrying a fold, a cast shadow, washed-out print and visible grain.
  # Two explanations fit that equally well -- the image never arrives in a
  # state where the damage is visible, or it arrives fine and the questions do
  # not elicit a YES. They call for opposite fixes, so guessing is expensive.
  #
  # This asks for a description instead of an answer. If the reply describes a
  # clean crisp document, the image path is at fault. If it describes folds and
  # blur while v5 still answers NO, the prompt is.
  #
  # The reader will mark every response to this variant malformed, which is
  # correct -- it is not a screen. `raw_response` is kept on every record, so
  # the text is readable anyway. That is what the raw field is for.
  quality_screen_describe:
    name: "quality_screen_describe"
    # Present so load_screen_vocabulary can read this variant. The reader will
    # reject the free-text answers against them, by design.
    evidence:
      blur: true
      shadow: true
      crease: true
      faded: true
      tilt: true
      speckle: true
    overall_levels: [NONE, MODERATE, HEAVY]
    prompt: |
      Look at this picture of a paper document and describe its physical condition.

      Say whether the writing looks sharp or blurry, whether any part of the paper is
      in shadow, whether the paper looks folded, creased or torn, whether any of the
      printing looks faded or patchy, whether the paper is straight or crooked, and
      whether the picture looks grainy or speckled.

      Answer in a few plain sentences. Describe what you can actually see.

  # =======================================================================
  # v5 -- the receipt/invoice screen. This is the variant the classify stage
  # runs; v1-v4 above are kept for reference.
  # =======================================================================
  # Three things differ from v1-v4, all of them driven by the fact that only
  # InternVL3.5-8B answers this:
  #
  # 1. UNIFORM POLARITY. Every question is phrased "is there a defect?", so
  #    YES always means something is wrong. v1-v4 mixed defect-phrased with
  #    good-phrased questions (SHARPNESS/SKEWING/WARPING asked "is it good?"),
  #    which is what let v4's skewing invert against v1/v2 under the same key
  #    name. An 8B model answers one consistent direction far more reliably.
  #
  # 2. PLAIN WORDS. "compression artefacts", "graininess", "legibility" and
  #    "foreshortening" are gone. A small model answers "does it look grainy or
  #    speckled" more reliably than it parses "digital noise that interferes
  #    with text legibility".
  #
  # 3. NO "don't explain" RULE. v1-v4 open with "No explanations or extra
  #    text", which is exactly the kind of don't-reason instruction that
  #    triggers <think> drift on InternVL3.5. It also collided with the answer
  #    set: NONE was the uncertainty token in v1-v4 and is now a severity
  #    value. Deliver this as a bare user message with no system prompt.
  #
  # The six criteria are exactly the defects the generator can produce, and
  # carry the same names as the generator's own defect labels
  # (generation_config.yml -> document_degradation.defect_labels.rules), so the
  # scorer needs no translation table between prompt slot and ground truth.
  #
  # Not asked, and why:
  #   handwriting, collage, staining  the ladder cannot create them, so the
  #     questions would measure nothing but a false-positive rate against a
  #     column that is never YES.
  #   curve  nothing in the pipeline bends or curls paper. The warp's
  #     `foreshorten` tilts a FLAT plane; Augraphy's page-curl augmentations
  #     are deliberately excluded because camera.py owns geometry. Asking
  #     would invite a YES no label could ever justify.

  # =======================================================================
  # v13 -- v12 plus COMPOSITION. The default once measured.
  # =======================================================================
  # Taxpayers photograph several receipts laid out on a table in one shot, and
  # downstream extraction handles those badly. That is a different failure from
  # everything questions 1-6 ask about: a four-receipt table photo can be
  # sharp, evenly lit and undamaged -- OVERALL: GOOD -- and still be
  # unprocessable. The remedy differs too. A blurred receipt needs
  # re-photographing; a collage needs splitting, or one document per photo.
  #
  # So it is reported on its own axis rather than folded into OVERALL. Forcing
  # a collage to POOR would make "POOR" mean either "unreadable, re-shoot" or
  # "perfectly readable, split it", with no way for the caller to tell which.
  #
  # WHY IT IS QUESTION 8 AND NOT 7. Questions 1-7 are byte-identical to v12,
  # including their numbering, so COMPOSITION is purely additive. That is what
  # makes the comparison clean: run v13 over the same 330 images and the six
  # criteria and the severity matrix should reproduce v12's numbers exactly. If
  # they move, the new question disturbed the others and we will see it
  # immediately rather than inferring it. OVERALL summarises 1-6, which still
  # all precede it; COMPOSITION is independent of them, so it loses nothing by
  # coming after.
  #
  # SINGLE/MULTIPLE shares no token with YES/NO or with GOOD/FAIR/POOR. That
  # matters: v11 lost 15 of 60 responses to the model confusing two answer
  # spaces, and v12 fixed it by making them disjoint. A third vocabulary keeps
  # that property rather than breaking it.
  #
  # Pagination is deliberately excluded, following the original prompt: a
  # single invoice printed across two sheets is one document. The question is
  # about separate documents, not separate pieces of paper.
  #
  # NOT YET MEASURED. There are no collages in quality_20260909, so this
  # criterion has no ground truth in the synthetic corpus and its accuracy is
  # unknown. It is to be measured against real photographs.
  quality_screen_v13:
    name: "quality_screen_v13"
    evidence:
      blur: false
      shadow: true
      crease: true
      faded: false
      tilt: false
      speckle: false
    overall_levels: [GOOD, FAIR, POOR]
    composition_levels: [SINGLE, MULTIPLE]
    condition_to_level:
      clean: GOOD
      moderate: FAIR
      heavy: POOR
    prompt: |
      Look at this picture of a receipt or invoice.

      Questions 1 to 6 must be answered with the single word YES or NO.
      Answer YES only if the statement is completely true of the whole picture.
      If any part of it falls short, answer NO.

      1. BLUR: Is every word perfectly sharp and in focus, across the whole picture?
      2. SHADOW: Is any part of the paper darker because of a shadow falling on it?
      3. CREASE: Does the paper look folded, creased, crumpled or torn anywhere?
      4. FADED: Is the printing even and unbroken everywhere, with no faded or patchy parts?
      5. TILT: Is the paper perfectly square to the edges of the picture, not turned at all?
      6. SPECKLE: Is the picture perfectly smooth and free of grain, speckling or noise?
      7. OVERALL: Rate the whole picture as GOOD, FAIR or POOR.
         GOOD means you found nothing wrong with it at all.
         FAIR means you found something wrong but the receipt is still easy to use.
         POOR means several things are wrong with it.
      8. COMPOSITION: Answer SINGLE or MULTIPLE.
         SINGLE means the picture shows one receipt or invoice.
         MULTIPLE means the picture shows two or more of them, laid out
         side by side, in a pile, or overlapping.
         One receipt printed across more than one sheet of paper still counts
         as SINGLE.

      Fill in this template:
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
      7. OVERALL:
      8. COMPOSITION:

  # =======================================================================
  # v14 -- uniform polarity, no absolutes. Tests a measured prompt defect.
  # =======================================================================
  # v13 answered "defect present" for BLUR on 330 of 330 images. Not most --
  # all of them. TILT on 281, SPECKLE on 293. Those three criteria carried no
  # information about the image at all, and 105 of 330 records reported two or
  # more "defects" on pictures the model then rated GOOD, most of them clean.
  #
  # The cause was in the wording, not the model. Four questions were
  # good-phrased with absolute terms -- "every word PERFECTLY sharp",
  # "PERFECTLY square, not turned at all", "PERFECTLY smooth and free of
  # grain" -- under an instruction that read:
  #
  #     Answer YES only if the statement is completely true of the whole
  #     picture. If any part of it falls short, answer NO.
  #
  # No real photograph of a receipt is perfectly sharp, perfectly square or
  # perfectly grain-free, so that instruction guaranteed NO. The questions were
  # measuring the word "perfectly", not the picture. FADED escaped because
  # "faded or patchy" is genuinely binary; SHADOW and CREASE escaped because
  # they were already defect-phrased. All three scored precision 1.000.
  #
  # So v14 makes every question defect-phrased and drops the absolutes. YES now
  # always means "something is wrong", which also removes the mixed-polarity
  # aggregation problem: the model's own answer sheet reads consistently, and
  # OVERALL is summarising a coherent signal instead of four always-NOs.
  #
  # SHADOW and CREASE keep v13's wording BYTE-IDENTICAL. They are the two that
  # already worked, and changing a working question while testing a fix to
  # broken ones would make the result unreadable.
  #
  # The strictness instruction is inverted with the phrasing. Under
  # defect-phrasing, "answer YES only if completely true" would make the model
  # reluctant to report anything -- the same error with the sign flipped. It
  # now asks plainly whether the defect can be seen.
  #
  # WHAT TO EXPECT. If the diagnosis is right, BLUR/TILT/SPECKLE precision
  # rises sharply from 0.597/0.427/0.642 and their recall falls from
  # 1.000/1.000/0.895. Severity should hold or improve, because OVERALL stops
  # having to discount three always-on inputs. If nothing moves, the wording
  # was not the cause and the always-YES came from somewhere else.
  quality_screen_v14:
    name: "quality_screen_v14"
    # Uniform: YES means the defect is present, for all six. The scorer's
    # polarity map becomes a formality rather than the thing that inverts a
    # whole report when it is wrong.
    evidence:
      blur: true
      shadow: true
      crease: true
      faded: true
      tilt: true
      speckle: true
    overall_levels: [GOOD, FAIR, POOR]
    composition_levels: [SINGLE, MULTIPLE]
    condition_to_level:
      clean: GOOD
      moderate: FAIR
      heavy: POOR
    prompt: |
      Look at this picture of a receipt or invoice.

      Questions 1 to 6 each ask whether something is wrong with the picture.
      Answer each one with the single word YES or NO.
      Answer YES if you can see the problem. Answer NO if you cannot.

      1. BLUR: Is any of the writing blurred or out of focus?
      2. SHADOW: Is any part of the paper darker because of a shadow falling on it?
      3. CREASE: Does the paper look folded, creased, crumpled or torn anywhere?
      4. FADED: Is any of the printing faded, patchy or broken up?
      5. TILT: Is the paper noticeably turned or crooked in the picture?
      6. SPECKLE: Does the picture look grainy, speckled or noisy?
      7. OVERALL: Rate the whole picture as GOOD, FAIR or POOR.
         GOOD means you found nothing wrong with it at all.
         FAIR means you found something wrong but the receipt is still easy to use.
         POOR means several things are wrong with it.
      8. COMPOSITION: Answer SINGLE or MULTIPLE.
         SINGLE means the picture shows one receipt or invoice.
         MULTIPLE means the picture shows two or more of them, laid out
         side by side, in a pile, or overlapping.
         One receipt printed across more than one sheet of paper still counts
         as SINGLE.

      Fill in this template:
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
      7. OVERALL:
      8. COMPOSITION:
  quality_screen_v5:
    name: "quality_screen_v5"
    # Uniform polarity: true for all six, because YES always means the defect
    # is present. Per-image ground truth comes from the generator's
    # quality_ground_truth.jsonl, which records which defects each image
    # actually carries; this block only fixes the direction.
    evidence:
      blur: true
      shadow: true
      crease: true
      faded: true
      tilt: true
      speckle: true
    # OVERALL is graded, not boolean, so it is declared separately rather than
    # forced into the evidence mapping. The levels are the generator's own
    # conditions: a clean render, and the two declared degradation tiers.
    overall_levels: [NONE, MODERATE, HEAVY]
    prompt: |
      Look at this picture of a receipt or invoice and answer each question with YES or NO.

      1. BLUR: Is the writing blurry or out of focus?
      2. SHADOW: Is there a dark shadow lying across the paper?
      3. CREASE: Is the paper folded or creased?
      4. FADED: Is any of the printing faded or patchy, so the letters are hard to read?
      5. TILT: Is the paper crooked or tilted, instead of straight up and down?
      6. SPECKLE: Does the picture look grainy or speckled?
      7. OVERALL: How bad is the picture overall? Answer NONE, MODERATE or HEAVY.
         Answer NONE if the picture is clear and easy to read.

      Fill in this template:
      1. BLUR:
      2. SHADOW:
      3. CREASE:
      4. FADED:
      5. TILT:
      6. SPECKLE:
