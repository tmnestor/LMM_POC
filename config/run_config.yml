# Document Extraction Configuration
# All options explicitly stated - YAML takes priority over defaults
# CLI flags override YAML when explicitly provided

# Bootstrap configuration — the minimal set the entrypoint and model loader need
# before any pipeline work begins (model identity, tiling, GPU count, log dir).
# conda_env: bootstrapped from LMM_CONDA_ENV + the entrypoint default; it CANNOT
# be a real key here (chicken-and-egg: this YAML is read by the conda python, so
# the env must already be chosen before this file is parsed).
bootstrap:
  # Model — InternVL3.5 via vLLM (we run the 8B). Registered types:
  # internvl3-vllm (8B, default), internvl3-14b-vllm, internvl3-38b-vllm,
  # gemma4-31b-w4a16-vllm and gemma4-12b-unified-vllm (A/B alternatives, 1xL40S).
  # Switch type + path together.
  #
  # ENV MATTERS: both gemma4-* types need vLLM >= 0.23.0, so they run in
  # `vllm_env3` (conda_envs/vllm_env3.yaml, vllm==0.25.1) — NOT `vllm_env2`,
  # which pins vllm==0.19.0 and lacks Gemma4UnifiedForConditionalGeneration.
  # Keep InternVL in vllm_env2: vllm_env3 pulls transformers 5.x, and
  # ensure_corrected_tokenizer()'s fix_mistral_regex path is unverified there.
  # Setup runbook: docs/gemma4-12b-sandbox-setup.md.
  #
  # Switching to EITHER gemma4-* type ALSO requires setting
  # inference.tiling.pre_tiling.enabled: false — Gemma sizes images via its own
  # soft-token budget, not InternVL 448-px tiling, and the load fails fast with
  # that explained if you forget.
  model:
    # type: internvl3-vllm
    # type: gemma4-12b-unified-vllm
    type: gemma4-12b-unified-w4a16-vllm
    # path: /home/jovyan/nfs_share/models/InternVL3_5-8B
    # path: /home/jovyan/nfs_share/models/gemma-4-12B-it
    path: /home/jovyan/nfs_share/models/gemma-4-12B-it-qat-w4a16-ct
    # path: /efs/shared/PTM/InternVL3_5-8B   # alternate (EFS) deployment path
    max_tiles: 18          # Image tiles (L4 / A10G: 18)
    min_tiles: null        # null = disabled; set (e.g. 6) for adaptive quality-based tiling (min_tiles..max_tiles)
    flash_attn: true       # Use Flash Attention 2 (L4 / A10G are Ampere+ — always on)
    # enforce_eager: true  # vLLM: true = skip CUDA graph compilation (faster startup,
                           #        lower throughput); false = compile graphs (slower
                           #        startup, higher throughput for long runs)
    # false from 2026-08-11: a 165-image run pays the compilation cost ONCE and
    # gets the decode speedup 165 times, so eager is the wrong trade here. Costs
    # extra VRAM for the captured graphs — there is ~10.7 GiB spare per L4 at
    # gpu_memory_utilization 0.90, but watch for OOM at engine load if the
    # soft-token budget is ever raised from 560.
    enforce_eager: false
    dtype: bfloat16        # Torch dtype (bfloat16, float16, float32)
    # vLLM only: override the chat template used by engine.chat().
    #   none            -> use the model's own template (default)
    #   <path/to/*.jinja> -> serve with this template instead (must exist)
    # Use this to disable a serve-side R1/thinking template that emits <think>
    # blocks. InternVL3.5 thinking is controlled by the system prompt, not
    # enable_thinking; a custom non-thinking template is the override of last
    # resort when the model dir ships a thinking-by-default template.
    chat_template: none
    # Model loading options (merged from the old top-level model_loading:).
    device_map: auto
    default_paths:
      internvl3: /home/jovyan/nfs_share/models/InternVL3_5-8B
      internvl3-vllm: /home/jovyan/nfs_share/models/InternVL3_5-8B
      gemma4-31b-w4a16-vllm: /home/jovyan/nfs_share/models/gemma-4-31B-it-qat-w4a16-ct
      gemma4-12b-unified-vllm: /home/jovyan/nfs_share/models/gemma-4-12B-it
      gemma4-12b-unified-w4a16-vllm: /home/jovyan/nfs_share/models/gemma-4-12B-it-qat-w4a16-ct
      # internvl3: /efs/shared/PTM/InternVL3_5-8B
      # internvl3-vllm: /efs/shared/PTM/InternVL3_5-8B
  # GPU count (moved from the old top-level processing: section).
  gpus:
    num_gpus: 0                # 0 = auto-detect all GPUs, 1 = single GPU, N = use N GPUs
    data_parallel_size: null   # null = auto (num_gpus for vLLM, ignored for HF)
  # Logging
  logging:
    # log_dir: /efs/shared/PoC_data/logs   # Directory for entrypoint log files (EFS-backed)
    # log_dir: ../evaluation_data/output/logs   # Directory for entrypoint log files (sandbox-backed)
    # Kept beside the dataset and the run outputs under tod_2026 (2026-08-11), so
    # a run's images, ground truth, artifacts and logs all live in one tree.
    # Follows output.dir when that is re-dated — keep the two in step.
    # log_dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output/logs
    # log_dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_20260807/logs
    # log_dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_degraded_20260811/logs
    # log_dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_nab_probe/logs
    # log_dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_20260811/logs
    # log_dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_20260811_rule9/logs
    log_dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_gemma_degraded/logs

# I/O paths moved into pipeline.information_extraction.* (2026-06-10) so all three
# pipelines (information_extraction / trust / linking) are symmetric
# pipeline.<name> blocks — top-level io.* is retired. See the pipeline: section.

# Inference configuration — generation budget, tiling, sampling, vLLM engine,
# and debug tracing. Everything that shapes how the model produces output.
inference:
  max_new_tokens: 3500   # Max tokens for generation (increased to avoid truncation on 30+ row statements)

  tiling:
    # vLLM app-side pre-tiling: crop each image into per-doc-type tiles ourselves
    # and hand vLLM the crops as separate images, so OUR tile count is
    # authoritative (the checkpoint's max_dynamic_patch=12 cap no longer bounds
    # dense bank statements). Tile counts come from budgets below
    # (bank=18, invoice=12, receipt=6). Enabling this REQUIRES raising
    # vllm.models.<model>.limit_mm_per_prompt to at least
    # max(budgets.*.max_tiles) + 1 (load fails fast otherwise).
    # See plans/2026-06-04-adaptive-pre-tiling.md. Leave off to run the 12-tile baseline.
    pre_tiling:
      enabled: false 
      # enabled: true       # true -> pre-tile; false -> single-image (vLLM tiles internally at 12)
      image_size: 448      # InternVL3 tile size in pixels
      use_thumbnail: true  # append a whole-image thumbnail after the detail tiles

    # Per-doc-type image tile budgets for InternVL3 dynamic tiling.
    # min_tiles is the FLOOR forced into the pre-tiling crop (dynamic_preprocess
    # min_num); max_tiles is the ceiling. Because the InternVL tiling algorithm
    # picks the grid by closest aspect-ratio match, a clean A4-portrait bank
    # statement settles on a 2x3 (6-tile) grid and NEVER reaches max_tiles on its
    # own — so raising max alone does nothing. min_tiles=12 forces the denser 3x4
    # grid (near-square cells, ~1.4x linear resolution) needed to read packed
    # transaction tables. Receipts/invoices keep min_tiles: 1 (aspect-matched).
    # Requires min_tiles <= max_tiles. See plans/2026-06-04-adaptive-tiling-dense-bank.md.
    budgets:
      default:
        min_tiles: 1
        max_tiles: 18
      bank_statement:
        min_tiles: 12
        max_tiles: 18
      invoice:
        min_tiles: 1
        max_tiles: 12
      receipt:
        min_tiles: 1
        max_tiles: 6

  # Generation parameters
  generation:
    defaults:
      max_new_tokens_base: 512
      max_new_tokens_per_field: 64
      temperature: 0.0
      do_sample: false
      top_p: 0.95
      use_cache: true
    models:
      internvl3:
        max_new_tokens_base: 2000
        max_new_tokens_per_field: 50
      # Keys are NORMALISED model types (app_config._normalize_model_type), NOT
      # the full registered names. The normalisation is not uniform, so these are
      # spelled out per model and locked by a test:
      #   gemma4-31b-w4a16-vllm         -> gemma4-31b
      #   gemma4-12b-unified-vllm       -> gemma4-12b-unified
      #   gemma4-12b-unified-w4a16-vllm -> gemma4-12b-unified  (SHARED with the
      #     BF16 12B above — deliberate. `-vllm` strips, "w4a16" fails the
      #     size-suffix test, then `-w4a16` strips. Same architecture, so the
      #     same generation budget; no separate key is needed or wanted.)
      # A wrong key here does NOT fail — the lookup silently falls back to
      # generation.defaults above, which is how it can look correct while doing
      # nothing.
      gemma4-31b:
        max_new_tokens_base: 512
        max_new_tokens_per_field: 64
      gemma4-12b-unified:
        max_new_tokens_base: 512
        max_new_tokens_per_field: 64
    token_limits:
      2b: null                    # use calculation
      8b: 800

  # vLLM engine parameters — per-model overrides for VllmSpec defaults
  vllm:
    defaults:
      gpu_memory_utilization: 0.90
      max_model_len: 8192
      max_num_seqs: 1
      limit_mm_per_prompt: 1
      enable_prefix_caching: true
    models:
      # pre_tiling (app-side, above) is used because vLLM's native
      # mm_processor_kwargs / hf_overrides can't tile above the checkpoint
      # default of 12 on this build — so we crop tiles ourselves.
      # pre_tiling.enabled is ON (above), so the internvl3-vllm
      # limit_mm_per_prompt below MUST stay >= max image_budget + 1 (= 19); at the
      # defaults value of 1, vLLM silently drops the extra crops -> under-tiling.
      internvl3-vllm:
        max_model_len: 16384         # 18 tiles + thumbnail ~= 4.9k vision + prompt + 4096 output
        limit_mm_per_prompt: 19      # 18 detail tiles + 1 thumbnail (required when pre_tiling on)
      # Gemma 4 31B-it QAT W4A16 (compressed-tensors) on 1xL40S, tp=1.
      # Weights ~18 GB of ~44-48 GiB, so unlike the BF16 31B (~58 GB, 2xL40S)
      # there is real headroom for KV cache and vision-encoder activations.
      # History worth respecting (old-repo commit a4b131d, BF16): soft tokens
      # 1120 OOM'd, gpu_memory_utilization 0.92 OOM'd, max_model_len 16384 was
      # cut to 8192. Activations were the binding resource, not weights — so
      # those limits are expected to lift at 4-bit, but VERIFY rather than assume.
      gemma4-31b-w4a16-vllm:
        max_model_len: 8192
        gpu_memory_utilization: 0.85
        limit_mm_per_prompt: 1       # one whole image; Gemma pan-and-scans internally
        max_num_seqs: 1
        enable_prefix_caching: true
        mm_processor_kwargs:
          # Gemma 4 accepts a DISCRETE set of visual token budgets:
          # 70 | 140 | 280 | 560 | 1120. Start at the value old history settled
          # on; 1120 is the sweep target for dense bank tables (Phase 5).
          max_soft_tokens: 560
        hf_overrides:
          vision_soft_tokens_per_image: 560
          vision_config:
            default_output_length: 560
      # Gemma 4 12B-it "Unified" (encoder-free, model_type gemma4_unified) on
      # 1xL40S, tp=1. ~24 GB BF16 — fits unquantised on a 40 GB+ card.
      # Needs vLLM >= 0.23.0 (support landed in vllm-project/vllm#44429, released
      # in STABLE v0.23.0 on 2026-06-15) — run it in vllm_env3 (vllm==0.25.1).
      # Budget note: this variant's own default is 280 soft tokens; 560 is set
      # here to match the 31B block so the A/B compares like with like.
      gemma4-12b-unified-vllm:
        max_model_len: 16384         # vLLM recipe recommends 16384-32768 for this model
        gpu_memory_utilization: 0.90 # recipe value; the 31B's 0.85 was a BF16 OOM workaround
        limit_mm_per_prompt: 1       # one whole image; Gemma pan-and-scans internally
        max_num_seqs: 1
        enable_prefix_caching: true
        mm_processor_kwargs:
          max_soft_tokens: 560       # legal: 70 | 140 | 280 (model default) | 560 | 1120
        # The override field names DIFFER from the 31B block above — verified
        # 2026-07-27 against this checkpoint's own config.json. The unified model
        # has NO top-level `vision_soft_tokens_per_image` and NO
        # `vision_config.default_output_length`; its budget knob is
        # `vision_config.num_soft_tokens` (ships as 280). Using the 31B's names
        # here sets attributes nothing reads — a silent no-op that leaves the
        # engine at 280 while the YAML claims 560.
        hf_overrides:
          vision_config:
            num_soft_tokens: 560
      # Gemma 4 12B-it Unified, QAT W4A16 (compressed-tensors) — the 2xL4 target.
      # SAME architecture as the BF16 12B above, so the hf_overrides field name is
      # identical (vision_config.num_soft_tokens); only the weights differ.
      # 9.56 GiB of ~22.5 GiB per L4 leaves ~10.7 GiB for KV cache and vision
      # activations at gpu_memory_utilization 0.90 — so one WHOLE engine fits per
      # card and run_dp spawns two (DP=2, tp=1 each), rather than sharding one
      # engine tp=2 across PCIe. See models/registry.py for the capability flag.
      gemma4-12b-unified-w4a16-vllm:
        max_model_len: 16384         # vLLM recipe recommends 16384-32768 for this model
        gpu_memory_utilization: 0.90 # ~20.25 GiB budget/card; 9.56 GiB of it is weights
        limit_mm_per_prompt: 1       # one whole image; Gemma pan-and-scans internally
        max_num_seqs: 1
        enable_prefix_caching: true
        mm_processor_kwargs:
          # 560 -> 1120 on 2026-08-11. At 560 the `nab_classic` layout sat right
          # on the legibility threshold: 2 of its 6 statements read perfectly and
          # the other 4 returned NOT_FOUND for every transaction list — the model
          # saw a bank statement but resolved no table at all. Bimodal
          # all-or-nothing at a fixed visual budget is a resolution limit, not a
          # reading error. Every other layout scored 0.924 at 560.
          # MEMORY WATCH: 1120 doubles peak prefill activation, and it competes
          # with CUDA graphs (enforce_eager: false) and disable_chunked_mm_input,
          # which forces each image's soft tokens through in ONE prefill step.
          # It fails loudly at engine load if it does not fit — revert to 560.
          # REVERTED 2026-08-11: 1120 was a decisive REGRESSION, not an
          # improvement. Global median F1 0.953 -> 0.369, mean 0.827 -> 0.455,
          # AND classification broke (55/55/55 -> 52/55/58: three bank statements
          # read as receipts) despite being 165/165 perfect at 560. Classify and
          # extract share the visual budget, so degrading both means the IMAGE
          # REPRESENTATION got worse at 1120 — more visual tokens is not more
          # detail for this checkpoint. Do not re-try 1120.
          # max_soft_tokens: 1120
          max_soft_tokens: 560       # legal: 70 | 140 | 280 (model default) | 560 | 1120
        # Unified architecture: the knob is vision_config.num_soft_tokens. This
        # checkpoint has NO top-level vision_soft_tokens_per_image and NO
        # vision_config.default_output_length (verified 2026-08-11 against its own
        # config.json) — using the 31B's names would set attributes nothing reads,
        # leaving the engine silently at 280 while the YAML claims otherwise.
        # MUST match max_soft_tokens above — a test asserts they agree, because a
        # mismatch leaves the engine at one budget while the YAML claims another.
        hf_overrides:
          vision_config:
            # num_soft_tokens: 1120
            num_soft_tokens: 560

  # Raw VLM prompt/response trace (debug observability; default off).
  # When enabled, every extraction VLM call (detection, bank turns, graph nodes,
  # linking fallback) appends one JSONL line via the shared VllmBackend seam.
  # The keys are, EXACTLY (see common/prompt_trace.py:record):
  #   image_name, pipeline, label, model, prompt, raw_response,
  #   prompt_tokens, completion_tokens
  # NOTE there is no `tokens` key — the counts are the two separate
  # prompt_tokens / completion_tokens fields. An earlier version of this comment
  # said `tokens`, which sends anyone reading it here to write `r.get("tokens")`
  # and silently get None for every line.
  tracing:
    raw_prompts: false   # true -> persist every VLM prompt+response to JSONL
    path: none           # none -> <output_dir>/raw_prompt_trace.jsonl ; or an explicit path

# Pipeline configuration — per-task settings grouped together: information
# extraction (the default classify/extract/clean/evaluate paths), classification,
# processing toggles, token budgets, trust + transaction linking, batch tuning,
# extraction ordering/skip labels, and the bank-header cache.
pipeline:
  # Information extraction — the DEFAULT image-source + output paths, used by the
  # MAIN extraction pipeline: KFP_TASK = run_info_extract | run_graph_robust |
  # classify | extract | clean | evaluate. Those read images from
  # information_extraction.input.dir, score against input.ground_truth, and write
  # to output.dir.
  #
  # OVERRIDE MECHANISM (why paths appear in three pipeline.<name> blocks): the
  # standalone linking and trust tasks REUSE the same classify/extract/clean
  # stages but on their OWN dataset. entrypoint.sh repoints the shared
  # image_dir/output globals at pipeline.linking.* (via _resolve_linking_vars) or
  # pipeline.trust.* (via _resolve_trust_vars), SHADOWING information_extraction.*
  # for the duration of that task.
  information_extraction:
    # Data paths
    input:
      # dir: /efs/shared/annotations/annotation_images
      # ground_truth: /efs/shared/annotations/lmm_poc_gt_20260325.csv
      # dir: ../evaluation_data/bank
      # ground_truth: ../evaluation_data/bank/ground_truth_bank.csv
      # dir: ../evaluation_data/synthetic_original
      # ground_truth: ../evaluation_data/synthetic_original/ground_truth_synthetic.csv
      # dir: ../evaluation_data/synthetic_transaction_linking
      # The 165-image synthetic set for the Gemma 4 evaluation (2026-08-11).
      # Absolute, and NOT tilde-prefixed: YAML reads a bare `~` as null and
      # nothing in the entrypoint path shell-expands these values.
      # synthetic_20260728 is CORRUPT — it holds 330 images (55 cases x 6) while
      # its ground truth covers only 165, so half of every run was extracted but
      # unscorable. Replaced 2026-08-11 by synthetic_20260807: 165 images, 165 GT
      # records, exact 1:1, 55 each of BANK_STATEMENT / INVOICE / RECEIPT.
      # Regenerated on the box 2026-08-11 via
      #   python -m generators.pipeline eval-set --out ~/nfs_share/tod_2026/evaluation_data
      # which emits a CLEAN and a DEGRADED set of 165 each, ground truth written
      # into both. Images and GT come from the SAME pass, so they cannot drift.
      # Swap the two lines below to score robustness against scan artefacts.
      # DEGRADED set: 55 receipts x 3 severity tiers (_v1 light, _v2 moderate,
      # _v3 heavy). Tier is recovered from the filename suffix at analysis time,
      # so one run covers all three. Swap to synthetic_ for the clean set — the
      # clean receipt scores are the tier-0 baseline.
      #
      # The _20260812 pair is the ONLY dated set on the box: the _20260811 pair
      # it replaced was deleted 2026-08-13, and the earlier _20260728 /
      # _20260807 sets before that. Nothing here is a fallback — if a path below
      # names a set that no longer exists, the run fails at the dataset check in
      # scripts/run_full_comparison.sh rather than scoring anything.
      #
      # It carries the same DOCUMENTS as _20260811 (the source YAMLs have not
      # changed since 2026-08-09 and the render is deterministic) but a
      # corrected ANSWER KEY: LINE_ITEM_PRICES no longer holds a derived unit
      # price for a line the receipt prints only a total for. A receipt line
      # shows one amount and that amount is the line total, so the per-unit
      # figure was a value no reader could extract. Positions where quantity is
      # 1 keep their amount (there the two coincide); the rest are NOT_FOUND.
      # Invoices are untouched — their layout has a real Unit Price column.
      # dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/nab_probe
      # dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/synthetic_20260812
      dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/degraded_20260812
      # Extraction GT generated from the per-type YAMLs in
      # Synthetic_Doc_Generation/ground_truth via scripts/generate_extraction_gt.py.
      # (Separate from linking.ground_truth, which the transaction-linking task uses.)
      # ground_truth: ../evaluation_data/synthetic_transaction_linking/ground_truth_extraction.csv
      # JSONL, not CSV — load_ground_truth() dispatches on the suffix
      # (common/evaluation_metrics.py) and the evaluator runs in _jsonl_mode,
      # scoring exactly the fields each GT record carries. The set also ships a
      # ground_truth.csv; keep the JSONL, which is what _jsonl_mode expects.
      #
      # MUST be swapped together with input.dir above. Each set ships its own GT
      # copy, and the clean and degraded copies of one dated pair hold the SAME
      # values (distortion never changes the answer), differing only in the
      # _v1/_v2/_v3 filenames — so crossing them inside a pair is harmless but
      # crossing DATED SETS is not: filenames match across dates, so the run
      # would score new extractions against an older answer key and report
      # plausible numbers. Keep the date on both lines identical.
      # ground_truth: /home/jovyan/nfs_share/tod_2026/evaluation_data/nab_probe/ground_truth.jsonl
      # ground_truth: /home/jovyan/nfs_share/tod_2026/evaluation_data/synthetic_20260812/ground_truth.jsonl
      ground_truth: /home/jovyan/nfs_share/tod_2026/evaluation_data/degraded_20260812/ground_truth.jsonl
      max_images: null       # null = process all images
      document_types: null   # null = all types, or comma-separated: INVOICE,RECEIPT,BANK_STATEMENT,TRAVEL_EXPENSE,VEHICLE_LOGBOOK
    # Output settings
    output:
      # dir: ../evaluation_data/output
      # Under tod_2026 alongside the input set (2026-08-11). The raw prompt trace
      # (inference.tracing.path: none) derives from this dir, so it follows.
      # DATED per dataset. The stages resume from image_name values already in
      # this directory's JSONLs (stages/io.py read_completed_images), so reusing
      # the old `output/` — which holds the corrupt 20260728 run's 330 records —
      # would silently skip every image instead of re-running it.
      # Dated per DATASET, not per day: a clean and a degraded run must not share
      # an output dir or the second inherits the first's completed image_names.
      # dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output
      # dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_20260807
      # dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_degraded_20260811
      # Dated per EXPERIMENT, not per day: output_20260811 holds the pre-rule-9
      # baseline (0.953 median / 0.827 mean) and is left untouched so the two are
      # directly comparable per document, not just by headline.
      # dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_nab_probe
      # dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_20260811
      # dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_20260811_rule9
      dir: /home/jovyan/nfs_share/tod_2026/evaluation_data/output_gemma_degraded
      skip_visualizations: false  # Skip visualization generation
      skip_reports: false         # Skip report generation

  # SROIE benchmark (KFP_TASK=sroie) — ICDAR 2019 Task 3 receipt key
  # information extraction, on a PUBLIC dataset. Separate from
  # information_extraction above: its own data, its own 4-field answer key
  # (company/date/address/total), its own prompt and scorer, and its own
  # output dir. It does NOT run classify/extract/clean/evaluate.
  #
  # The stage reads ONLY this block. Every key below is required — a
  # missing key fails at startup with a diagnostic rather than defaulting.
  #
  # Comparability between models rests on this block and the model type
  # being the ONLY things that differ between two runs: same prompt, same
  # parser, same scorer. Give each model its OWN output_dir so a second run
  # cannot overwrite the first.
  sroie:
    # The split ROOT — the directory CONTAINING img/ and entities/, not
    # either subdirectory.
    #
    # test/ is the 347-image ICDAR leaderboard split and is what we report.
    # The 626-image train split also ships (as img/ + key/ at the dataset
    # root); it is NOT interchangeable — two of its records have a blank
    # answer-key field and the loader rejects them by design.
    # dir: /home/jovyan/nfs_share/tod_2026/data/sroie          # 626-image train split
    data_dir: /home/jovyan/nfs_share/tod_2026/data/sroie/test  # 347-image test split
    # Dated per MODEL, not per day. Swap when switching model type, or the
    # second model's artefacts overwrite the first's and the comparison is
    # lost.
    # output_dir: /home/jovyan/nfs_share/tod_2026/data/sroie/output_gemma4
    output_dir: /home/jovyan/nfs_share/tod_2026/data/sroie/output_internvl3
    # Matches the configured max_tiles for internvl3_5_8b in
    # config/model_config.yaml. Receipts are tall narrow scans where the
    # address is what a low tile budget loses first — do NOT lower this for
    # throughput.
    max_tiles: 12
    # Four short fields. 256 is ample; a larger budget only lengthens a
    # runaway repetition loop before it is caught.
    max_new_tokens: 256

  # Classification settings
  classification:
    fallback_type: UNIVERSAL     # Default type when model response can't be parsed

  # Processing options
  processing:
    batch_size: null             # Images per batch (null = auto-detect from VRAM, 1 = sequential)
    bank_v2: true              # Use V2 bank statement extraction
    balance_correction: false  # Disable balance validation (reduces accuracy)
    verbose: false             # Tier B: init/config details (auto-batch, gen-config, processing X, field counts)
    debug: false               # Tier C: dev noise (PARSING DEBUG, CONFIG DEBUG, TENSOR_DTYPE, prompt/response dumps)

  # Named token budgets — single source of truth for all max_tokens values.
  # Workflow YAML nodes reference these by name via `token_budget: <name>`.
  token_budgets:
    classify: 150
    detection: 200
    detect_headers: 500
    detect_headers_short: 200
    extract_standard: 2048
    extract_travel: 1024
    extract_bank: 4096
    bank_header_detection: 500
    transaction_match: 2000
    receipt_extract: 500
    orchestrator_generate: 1024
    bank_statement_floor: 1500
    fallback_base: 512
    fallback_per_field: 64
    trust_classify: 300
    trust_field_extract: 500

  # Trust distribution linking — NRO Private Wealth compliance checking.
  # Paths below SHADOW io.input/io.output when KFP_TASK=trust_* (entrypoint.sh
  # _resolve_trust_vars repoints the shared stages here; see the io: header).
  trust:
    data_dir: ../private_wealth_docs
    quads: ../private_wealth_docs/output/trust_quads.csv
    quads_incomplete: ../private_wealth_docs/output/trust_quads_incomplete.csv
    ground_truth: ../private_wealth_docs/ground_truth/trust_distribution_links.yml
    classification_ground_truth: ../private_wealth_docs/ground_truth/trust_classification_gt.yml
    classifications: ../private_wealth_docs/output/trust_classifications.jsonl
    raw_extractions: ../private_wealth_docs/output/raw_extractions.jsonl
    compliance_results: ../private_wealth_docs/output/trust_compliance_results.jsonl
    output_dir: ../private_wealth_docs/output
    evaluation_dir: ../private_wealth_docs/output/trust_evaluation
    log_dir: ../private_wealth_docs/output/logs
    subdirectories:
      # Production (flat directory, trust_classify generates quads):
      trust_return: .
      distribution_stmt: .
      income_schedule: .
      beneficiary_itr: .
      # Development (pre-sorted subdirectories):
      #   trust_return: trust_returns
      #   distribution_stmt: distribution_statements
      #   income_schedule: trust_income_schedules
      #   beneficiary_itr: beneficiary_itrs
    amount_tolerance: 0.01    # trust-eval amount match tolerance (relative)
    linking_fields:
      # ID fields compared as ABN/TFN (space-normalised exact match)
      id_fields:
        - trust_abn
        - beneficiary_tfn
      # Amount fields compared numerically within amount_tolerance
      amount_fields:
        - share_of_net_income
        - franking_credit
        - capital_gain_component

  # Transaction linking — receipt/invoice -> bank-statement debit matching.
  # Standalone task (KFP_TASK=run_transaction_link); does NOT touch the trust
  # pipeline. Matcher-first: the algorithmic matcher links against the rows the
  # extract stage already pulled; receipts it can't confidently match fall
  # through to a targeted single-image VLM lookup. Every key is required —
  # stages/transaction_link.py fails fast on a missing one.
  linking:
    case_key_pattern: "^(?P<case>[^_]+)_"   # group files by case (split on first "_")
    vlm_prompt: single_receipt_link          # prompt file in prompts/ (without .yaml)
    vlm_max_tokens: 4096                      # token budget for the fallback VLM lookup
    vlm_temperature: 0.0                      # MUST be 0.0 — the shared generate seam is deterministic
    hybrid_amount_tolerance: 0.01            # $ gate for an algorithmic amount match
    hybrid_date_window_days: 5               # business-day window for date scoring
    hybrid_description_threshold: 0.3        # min token-overlap fraction for description support
    hybrid_min_confidence: LOW               # min matcher confidence to accept without VLM (HIGH|MEDIUM|LOW)
    # --- Paths: these SHADOW io.input/io.output when KFP_TASK=run_transaction_link.
    # entrypoint.sh _resolve_linking_vars points the shared classify/extract/clean
    # stages at data_dir below and writes all artifacts under output's parent dir.
    # (Keys above are linking-specific knobs; see the io: header for the mechanism.)
    data_dir: ../evaluation_data/synthetic_transaction_linking
    output: ../evaluation_data/synthetic_transaction_linking/output/transaction_links.jsonl
    ground_truth: ../evaluation_data/synthetic_transaction_linking/transaction_links.yml   # optional eval; if set -> evaluate_linking runs
    evaluation_dir: ../evaluation_data/synthetic_transaction_linking/output/transaction_evaluation
    log_dir: ../evaluation_data/synthetic_transaction_linking/output/logs

  # Batch processing tuning
  batch:
    # Keys are NORMALISED model types (see the generation.models note above).
    # Both Gemma variants are pinned to 1: a single-card engine has no room to
    # widen, and stating it explicitly beats falling through to batch.min_size.
    default_sizes: {internvl3: 4, gemma4-31b: 1, gemma4-12b-unified: 1}
    max_sizes: {internvl3: 8, gemma4-31b: 1, gemma4-12b-unified: 1}
    conservative_sizes: {internvl3: 1, gemma4-31b: 1, gemma4-12b-unified: 1}
    min_size: 1
    strategy: balanced            # conservative | balanced | aggressive
    auto_detect: true

  # Extraction ordering — controls batch submission order for prefix-cache reuse
  extraction:
    order:
      - bank_statement
      - invoice
      - receipt
    secondary_sort: none              # none | image_area_asc | image_area_desc
    # Labels that skip extraction entirely (written as skipped records)
    skip_labels: []

  # Per-bank column-mapping cache (standalone bank workflow only)
  bank_header_cache:
    enabled: false
    key_pattern: "^(?P<institution>[A-Za-z]+)_"

# Resources — GPU memory thresholds and infrastructure timeouts.
resources:
  # GPU memory thresholds (GB) — drive auto-batch-size selection.
  gpu_memory:
    low: 8                      # GB — conservative batching
    medium: 16                  # GB — balanced batching
    high: 24                    # GB — aggressive batching
    very_high: 64               # GB — maximum batching

  # Infrastructure settings — timeouts, memory thresholds
  infrastructure:
    # No dp_timeout: data-parallel workers run until they finish or die (run_dp
    # polls worker liveness instead of imposing an arbitrary wall-clock cap).
    dp_join_timeout: 60           # seconds, process join timeout
    gpu_memory_threshold_gb: 1.0
    gpu_memory_fallback_gb: 24.0
