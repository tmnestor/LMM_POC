# Document Extraction Configuration
# All options explicitly stated - YAML takes priority over defaults
# CLI flags override YAML when explicitly provided

# Bootstrap configuration — the minimal set the entrypoint and model loader need
# before any pipeline work begins (model identity, tiling, GPU count, log dir).
# conda_env: bootstrapped from LMM_CONDA_ENV + the entrypoint default; it CANNOT
# be a real key here (chicken-and-egg: this YAML is read by the conda python, so
# the env must already be chosen before this file is parsed).
bootstrap:
  # Model — InternVL3.5 via vLLM (we run the 8B). Registered types:
  # internvl3-vllm (8B, default), internvl3-14b-vllm, internvl3-38b-vllm.
  # Switch type + path together.
  model:
    type: internvl3-vllm
    path: /home/jovyan/nfs_share/models/InternVL3_5-8B
    # path: /efs/shared/PTM/InternVL3_5-8B   # alternate (EFS) deployment path
    max_tiles: 18          # Image tiles (L4 / A10G: 18)
    min_tiles: null        # null = disabled; set (e.g. 6) for adaptive quality-based tiling (min_tiles..max_tiles)
    flash_attn: true       # Use Flash Attention 2 (L4 / A10G are Ampere+ — always on)
    enforce_eager: false    # vLLM: true = skip CUDA graph compilation (faster startup,
                           #        lower throughput); false = compile graphs (slower
                           #        startup, higher throughput for long runs)
    dtype: bfloat16        # Torch dtype (bfloat16, float16, float32)
    # vLLM only: override the chat template used by engine.chat().
    #   none            -> use the model's own template (default)
    #   <path/to/*.jinja> -> serve with this template instead (must exist)
    # Use this to disable a serve-side R1/thinking template that emits <think>
    # blocks. InternVL3.5 thinking is controlled by the system prompt, not
    # enable_thinking; a custom non-thinking template is the override of last
    # resort when the model dir ships a thinking-by-default template.
    chat_template: none
    # Model loading options (merged from the old top-level model_loading:).
    device_map: auto
    default_paths:
      internvl3: /home/jovyan/nfs_share/models/InternVL3_5-8B
      internvl3-vllm: /home/jovyan/nfs_share/models/InternVL3_5-8B
      # internvl3: /efs/shared/PTM/InternVL3_5-8B
      # internvl3-vllm: /efs/shared/PTM/InternVL3_5-8B
  # GPU count (moved from the old top-level processing: section).
  gpus:
    num_gpus: 0                # 0 = auto-detect all GPUs, 1 = single GPU, N = use N GPUs
    data_parallel_size: null   # null = auto (num_gpus for vLLM, ignored for HF)
  # Logging
  logging:
    # Directory for entrypoint log files.
    #
    # ONE OF FOUR PATHS THAT MOVE TOGETHER (see the block above `input:` under
    # pipeline.information_extraction). This is the one furthest from the other
    # three, so it is the one that gets left behind. It MUST sit under
    # information_extraction.output.dir -- under KFP that is the only writable
    # path in the pod -- and startup refuses the config if it does not.
    #
    # To log somewhere else off KFP, set the LMM_LOG_DIR env var, which
    # overrides this entirely.
    log_dir: ../evaluation_data/quality_20260909/output/logs

# I/O paths moved into pipeline.information_extraction.* (2026-06-10) so all three
# pipelines (information_extraction / trust / linking) are symmetric
# pipeline.<name> blocks — top-level io.* is retired. See the pipeline: section.

# Inference configuration — generation budget, tiling, sampling, vLLM engine,
# and debug tracing. Everything that shapes how the model produces output.
inference:
  max_new_tokens: 3500   # Max tokens for generation (increased to avoid truncation on 30+ row statements)

  tiling:
    # vLLM app-side pre-tiling: crop each image into per-doc-type tiles ourselves
    # and hand vLLM the crops as separate images, so OUR tile count is
    # authoritative (the checkpoint's max_dynamic_patch=12 cap no longer bounds
    # dense bank statements). Tile counts come from budgets below
    # (bank=18, invoice=12, receipt=6). Enabling this REQUIRES raising
    # vllm.models.<model>.limit_mm_per_prompt to at least
    # max(budgets.*.max_tiles) + 1 (load fails fast otherwise).
    # See plans/2026-06-04-adaptive-pre-tiling.md. Leave off to run the 12-tile baseline.
    pre_tiling:
      enabled: true       # true -> pre-tile; false -> single-image (vLLM tiles internally at 12)
      image_size: 448      # InternVL3 tile size in pixels
      use_thumbnail: true  # append a whole-image thumbnail after the detail tiles

    # Per-doc-type image tile budgets for InternVL3 dynamic tiling.
    # min_tiles is the FLOOR forced into the pre-tiling crop (dynamic_preprocess
    # min_num); max_tiles is the ceiling. Because the InternVL tiling algorithm
    # picks the grid by closest aspect-ratio match, a clean A4-portrait bank
    # statement settles on a 2x3 (6-tile) grid and NEVER reaches max_tiles on its
    # own — so raising max alone does nothing. min_tiles=12 forces the denser 3x4
    # grid (near-square cells, ~1.4x linear resolution) needed to read packed
    # transaction tables. Receipts/invoices keep min_tiles: 1 (aspect-matched).
    # Requires min_tiles <= max_tiles. See plans/2026-06-04-adaptive-tiling-dense-bank.md.
    budgets:
      default:
        min_tiles: 1
        max_tiles: 18
      bank_statement:
        min_tiles: 12
        max_tiles: 18
      invoice:
        min_tiles: 1
        max_tiles: 12
      receipt:
        min_tiles: 1
        max_tiles: 6

  # Generation parameters
  generation:
    defaults:
      max_new_tokens_base: 512
      max_new_tokens_per_field: 64
      temperature: 0.0
      do_sample: false
      top_p: 0.95
      use_cache: true
    models:
      internvl3:
        max_new_tokens_base: 2000
        max_new_tokens_per_field: 50
    token_limits:
      2b: null                    # use calculation
      8b: 800

  # vLLM engine parameters — per-model overrides for VllmSpec defaults
  vllm:
    defaults:
      gpu_memory_utilization: 0.90
      max_model_len: 8192
      max_num_seqs: 1
      limit_mm_per_prompt: 1
      enable_prefix_caching: true
    models:
      # pre_tiling (app-side, above) is used because vLLM's native
      # mm_processor_kwargs / hf_overrides can't tile above the checkpoint
      # default of 12 on this build — so we crop tiles ourselves.
      # pre_tiling.enabled is ON (above), so the internvl3-vllm
      # limit_mm_per_prompt below MUST stay >= max image_budget + 1 (= 19); at the
      # defaults value of 1, vLLM silently drops the extra crops -> under-tiling.
      internvl3-vllm:
        max_model_len: 16384         # 18 tiles + thumbnail ~= 4.9k vision + prompt + 4096 output
        limit_mm_per_prompt: 19      # 18 detail tiles + 1 thumbnail (required when pre_tiling on)

  # Raw VLM prompt/response trace (debug observability; default off).
  # When enabled, every extraction VLM call (detection, bank turns, graph nodes,
  # linking fallback) appends one JSONL line {image_name, pipeline, label, prompt,
  # raw_response, tokens} via the shared VllmBackend seam.
  tracing:
    raw_prompts: false   # true -> persist every VLM prompt+response to JSONL
    path: none           # none -> <output_dir>/raw_prompt_trace.jsonl ; or an explicit path

# Pipeline configuration — per-task settings grouped together: the shared
# input/output paths, the image-quality screen, classification, processing
# toggles, token budgets and batch tuning.
pipeline:
  # The image-source + output paths for BOTH tasks on this branch: classify
  # reads images from input.dir, and evaluate scores the screen's answers
  # against the corpus labels beside them, writing to output.dir.
  #
  # The name is a leftover from the extraction pipeline this branch was cut
  # from. It stays because entrypoint.sh reads these three keys through
  # scripts/resolve_yaml_defaults.py as YAML_DATA_DIR / YAML_GROUND_TRUTH /
  # YAML_OUTPUT_DIR, and PROD run_config files are edited against those names.
  # Renaming the block is a coordinated change with PROD, not a tidy-up.
  #
  # There is no longer an override mechanism here. The trust and linking tasks
  # that used to shadow these paths with pipeline.trust.* / pipeline.linking.*
  # are gone, so these paths are the only ones a run can use.
  information_extraction:
    # -----------------------------------------------------------------------
    # FOUR PATHS THAT MOVE TOGETHER when you switch corpora:
    #
    #   input.dir           the images                    (below)
    #   input.ground_truth  the labels, beside them       (below)
    #   output.dir          where this run writes         (below)
    #   bootstrap.logging.log_dir   under output.dir      (top of this file)
    #
    # They are written out in full rather than derived from a shared root, so
    # that reading any one line tells you where it points. The cost is that
    # updating three of the four is possible, and two of those mistakes are
    # silent -- a stale ground_truth scores one corpus against another set's
    # answers and reports an ordinary-looking number. So startup CHECKS that
    # ground_truth sits under input.dir and log_dir under output.dir, and
    # refuses the config otherwise. Nothing is derived; the check only rejects
    # a set of paths that cannot all be true at once.
    # -----------------------------------------------------------------------
    input:
      # The quality-screen corpus: 110 cases x (clean, moderate, heavy) across
      # invoices and receipts = 330 images. Built by Synthetic_Doc_Generation on
      # branch feature/quality-screen-corpus, which writes the answer key beside
      # the images from its OWN distortion provenance -- the generator records
      # which augmentations it drew and at what strength, so the labels are what
      # was applied rather than a second opinion about the render.
      #
      # Severity is in the FILENAME suffix (_moderate, _heavy; clean has none),
      # so one run covers all three rungs. Regenerate with the commands in
      # IMAGE_QUALITY_SCREEN.md rather than editing the labels by hand.
      dir: ../evaluation_data/quality_20260909
      # Defect labels, one record per image: which of the six criteria are
      # present, plus the `condition` rung. NOT an extraction answer key -- it
      # carries no field values, and the screen never reads the document.
      #
      # MUST be swapped together with input.dir above. Filenames repeat across
      # generated sets, so crossing two sets scores one corpus's answers against
      # another's images and reports plausible numbers rather than failing.
      #
      # `condition` is mapped to an OVERALL level by
      # pipeline.quality_screen.condition_to_level below; a condition with no
      # mapping fails fast rather than being dropped from the report.
      ground_truth: ../evaluation_data/quality_20260909/quality_ground_truth.jsonl
      max_images: null       # null = process all images
      document_types: null   # null = all types. The screen runs BEFORE any
                             # classification and does not know invoice from
                             # receipt, so filtering here would mean filtering
                             # on the filename rather than on the document.
    # Output settings
    output:
      # Both stages write here: classify writes quality_screen.jsonl (named by
      # pipeline.quality_screen.output_name), evaluate reads it and writes the
      # report beside it. Under KFP this is the only writable path in the pod.
      #
      # One dir per PROMPT VARIANT is the useful split, not one per model:
      # comparing variants is what this branch is for, and a shared dir means
      # the second run's report silently describes the first run's records.
      dir: ../evaluation_data/quality_20260909/output

  # ------------------------------------------------------------------------
  # Image-quality screen (KFP_TASK=classify)
  # ------------------------------------------------------------------------
  # Answers six YES/NO defect questions and one graded OVERALL per image, and
  # scores them against the corpus's own defect labels. Runs as
  # classify -> evaluate with NO clean stage between: `clean` normalises
  # free-text field values, and these answers are already canonical tokens.
  #
  # `classify` is the screen on this branch, not document-type detection. The
  # KFP task name is kept because the manifest keys the GPU pod on it -- the
  # screen wants every GPU, evaluate wants none.
  quality_screen:
    # Which prompt, by name. A variant, not a constant: reading this file must
    # answer "which prompt did this run use?" without consulting Python.
    #
    # v13 is the measured default (330 images, 2026-09-10, 2xL4). Collapsed to
    # the decision the screen exists to make -- does this image need attention?
    # -- it scores recall 0.950, precision 0.995, F1 0.972, and three-level
    # severity 282/330 = 85.5%. It is v12 plus one question, COMPOSITION, which
    # asks how many documents are in the picture; taxpayers photograph several
    # receipts at once and extraction handles those badly.
    #
    # Chosen over v12 (recall 0.977, precision 0.935, severity 72.4% on the same
    # hardware and corpus). The trade is one heavily degraded image passed,
    # against fourteen fewer taxpayers asked to re-photograph a receipt that was
    # fine -- 15 of 110 clean images wrongly flagged under v12, 1 under v13.
    #
    # Zero unreadable responses, as v12. v9 lost 9 of 60 and v11 lost 15, both
    # to the model confusing the YES/NO answer space with the severity one.
    # v12 added GOOD/FAIR/POOR and v13 added SINGLE/MULTIPLE; all three
    # vocabularies are disjoint, which is what keeps the malformed rate at nil.
    #
    # ITS CRITERIA ARE MIXED POLARITY, AND THAT IS LOAD-BEARING. It looks like a
    # defect: the good-phrased questions ask whether the image is PERFECTLY
    # sharp / square / smooth, and no real photograph is, so BLUR is answered
    # "not perfect" on 330 of 330 images and carries no information about any
    # of them.
    #
    # Two variants were built to fix that and both were much worse:
    #
    #   v14  all defect-phrased, plain wording   severity 51.2%, recall 0.623
    #   v15  all defect-phrased, low threshold   severity 48.8%, recall 0.550
    #
    # Both reached precision 1.000 on all six criteria and both rated 20+
    # heavily degraded receipts GOOD. The criteria do not inform OVERALL, they
    # PRIME it: answering "not perfect" everywhere leaves the model critical and
    # it then judges severity well; answering "no problem seen" everywhere
    # leaves it lenient and it judges badly. Making the criteria individually
    # accurate makes the screen worse.
    #
    # So do not "fix" the polarity or the absolutes without re-measuring
    # severity and the binary decision. The per-criterion table is not the
    # deliverable and optimising it has already cost two GPU runs.
    prompt_file: prompts/quality_screen.yaml
    variant: quality_screen_v13

    # Written by classify, read by evaluate. Keeping the raw responses out of
    # the scorer's way means a threshold or parser change re-scores without
    # paying for 330 images of inference again.
    output_name: quality_screen.jsonl

    # Tile budget for the screen. NOT optional in practice.
    #
    # Without a budget the backend skips app-side pre-tiling and lets vLLM
    # choose the grid by closest aspect-ratio match. A 2510x4478 invoice lands
    # on many tiles and the model duly reports its crease, shadow and grain. A
    # 558x848 receipt lands on about ONE, and the model then describes a heavy
    # receipt -- fold, cast shadow, washed-out print -- as "good physical
    # condition", word for word identically to the clean one.
    #
    # min_tiles is the lever, not max_tiles: the aspect-ratio match settles
    # small images low and never reaches the ceiling on its own. Raising the
    # floor forces the denser grid.
    #
    # One budget for both document types, because the screen runs before any
    # classification and does not know which it is looking at. 6 is the
    # documented knee for receipts; 12 is the invoice ceiling elsewhere in this
    # file, and is not raised here because invoice prompts already approach
    # max_model_len (a 16734 > 14588 overflow was logged on the composited
    # invoice at single-image tiling).
    tiling:
      # 12, measured. 6 rescued heavy damage on receipts but not moderate; 12
      # rescued both. Note this differs from the extraction budget, where 6 is
      # the knee and 12 was rejected -- judging whether text is blurred needs
      # more resolution than reading it does.
      #
      # For a small receipt the tiles are UPSAMPLED (a 506x850 image becomes 12
      # tiles of 448x448), so this buys no extra information. It buys model
      # capacity per unit of image area: a fold spanning 20 pixels in the
      # original spans ~50 in a tile and is attended to accordingly.
      min_tiles: 12
      max_tiles: 12

    # The corpus records a condition; the prompt answers a severity level. Two
    # vocabularies for one ladder, and the mapping between them is a contract
    # between this repo and Synthetic_Doc_Generation. Declared here rather than
    # assumed in the scorer: a condition with no level fails fast instead of
    # dropping a whole severity from the report.
    condition_to_level:
      clean: NONE
      moderate: MODERATE
      heavy: HEAVY

    # The decision the pipeline actually makes: does this image go on to
    # information extraction, or go back to the taxpayer?
    #
    # Declared here rather than inferred in the scorer, because the screen's
    # two axes do not combine the way a reader expects and the combination is
    # a policy choice, not a derivation.
    routing:
      # Severity levels that pass. Anything else is sent back for re-capture.
      # The variant's own `overall_levels` name these -- v13 answers
      # GOOD/FAIR/POOR, so FAIR and POOR are both sent back.
      pass_levels: [GOOD]

      # What to do with a photograph holding several documents.
      #
      # `reject`, because downstream extraction does not handle a collage
      # reliably whether or not the photograph is any good. A plate of four
      # receipts can be sharp, evenly lit and undamaged -- nothing is wrong
      # with the *picture* -- and still be unprocessable. So composition
      # overrides severity here: MULTIPLE fails even at GOOD.
      #
      # This is why a clean collage graded POOR is not a false alarm. Scored
      # against severity alone it counts as one, and the screen looks less
      # precise than it is; scored against this gate it is a correct decision
      # reached by a different route.
      #
      # `allow` exists for a pipeline whose extraction can split a plate
      # itself. Ours cannot.
      multiple_documents: reject

  classification:
    fallback_type: UNIVERSAL     # Default type when model response can't be parsed

  # Processing options
  # Output verbosity. Two levels, both off by default -- per-image progress is
  # logged by the stage regardless of either.
  processing:
    verbose: false             # Tier B: init/config details (gen-config, field counts)
    debug: false               # Tier C: dev noise (prompt/response dumps, tracebacks)

  # Named token budgets — single source of truth for all max_tokens values.
  # Workflow YAML nodes reference these by name via `token_budget: <name>`.
  token_budgets:
    classify: 150
    # Eight short lines, plus room for a description ahead of them: v7 asks the
    # model to describe the paper before answering, because asked bare YES/NO
    # questions it answers from a prior rather than from the image. A truncated
    # final slot reads as a missing answer and costs the whole record, so this
    # is sized for the longest variant rather than the shortest.
    quality_screen: 400
    detection: 200
    detect_headers: 500
    detect_headers_short: 200
    extract_standard: 2048
    extract_travel: 1024
    extract_bank: 4096
    bank_header_detection: 500
    transaction_match: 2000
    receipt_extract: 500
    orchestrator_generate: 1024
    bank_statement_floor: 1500
    fallback_base: 512
    fallback_per_field: 64

# Resources — GPU memory thresholds and infrastructure timeouts.
resources:
  # Infrastructure settings — timeouts, memory thresholds
  infrastructure:
    # No dp_timeout: data-parallel workers run until they finish or die (run_dp
    # polls worker liveness instead of imposing an arbitrary wall-clock cap).
    dp_join_timeout: 60           # seconds, process join timeout
    gpu_memory_threshold_gb: 1.0
    gpu_memory_fallback_gb: 24.0
